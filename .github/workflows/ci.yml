# CI パイプライン - プッシュとプルリクエストで自動テスト・リントを実行
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Python テスト - pytest でユニットテストを実行
  python-tests:
    name: Python テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係のインストール
        run: pip install -r requirements.txt -r requirements-dev.txt

      # assets/*.ttf は .gitignore のため fresh checkout には存在せず、
      # test_pdf_creator の ensure_fonts() が毎回 GitHub から 19MB の
      # NotoSansJP を取得する。この取得が raw.githubusercontent への一過性
      # ネットワーク障害で落ちると Python テストが flaky に失敗するため、
      # ダウンロード済みフォントをキャッシュして再取得を避ける（cache hit 時は
      # ネットワーク不要 → 安定 + 高速）。フォント URL が変わったら key を上げる。
      - name: フォントキャッシュ（NotoSansJP）
        uses: actions/cache@v4
        with:
          path: assets/*.ttf
          key: notosansjp-fonts-v1

      - name: テスト実行
        run: python -m pytest tests/ -v

  # Python 型チェック - mypy で静的型解析を実行
  python-lint:
    name: Python 型チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存関係のインストール
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: mypy 型チェック実行
        run: python -m mypy src/ --ignore-missing-imports

  # TypeScript テスト - Node.js テストランナーで実行
  typescript-tests:
    name: TypeScript テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール
        run: npm install

      - name: テスト実行
        run: npm test

      - name: 型チェック実行
        run: npm run lint
