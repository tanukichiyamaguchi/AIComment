name: Generate Jissen Comments

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile name (jissen_default, jissen_2024_q1, jissen_2024_q2, jissen_2024_q3, jissen_2024_q4). Ignored if target_folder is set.'
        type: string
        default: ""
      target_folder:
        description: 'Discovery mode: target subfolder name under DRIVE_INPUT_ROOT (use "__list__" to list candidates). Overrides profile when set.'
        type: string
        default: ""
      batch_mode:
        description: 'Use Batch API (50% off)'
        type: boolean
        default: true
      test_count:
        description: 'Test mode: process only N items (0 = all)'
        type: number
        default: 0
      create_gmail_drafts:
        description: 'Create Gmail drafts for clinics (OFF by default; turn ON to email)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # Workload Identity 連携に必要

# 同じプロファイル / target_folder への並行実行をシリアル化する（同時 2 実行で
# 同一 PDF が重複処理 → Drive/Sheets/Gmail で重複作成 を防ぐ、P-023）。
# 後発実行はキューに入り、先発実行が終わってから走る（cancel-in-progress: false）。
concurrency:
  group: generate-comments-${{ inputs.target_folder || inputs.profile || 'jissen_default' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6時間

    steps:
      - uses: actions/checkout@v4

      # Google Cloud 認証（Workload Identity 連携）
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run comment generation
        run: |
          # 優先順位:
          # 1. target_folder 指定 → フォルダ自動検出モード（profile より優先）
          # 2. profile 指定        → 既存プロファイルモード
          # 3. どちらも未指定      → jissen_default プロファイル（既存挙動）
          if [ "${{ inputs.batch_mode }}" = "true" ]; then
            ENTRY="python -m src.batch_main"
          else
            ENTRY="python -m src.main"
          fi

          if [ -n "${{ inputs.target_folder }}" ]; then
            $ENTRY \
              --target-folder "${{ inputs.target_folder }}" \
              --test-count ${{ inputs.test_count }}
          elif [ -n "${{ inputs.profile }}" ]; then
            $ENTRY \
              --profile "${{ inputs.profile }}" \
              --test-count ${{ inputs.test_count }}
          else
            $ENTRY \
              --test-count ${{ inputs.test_count }}
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # jissen_default プロファイル用（既存）
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          # jissen_2024_q1 〜 q4 プロファイル用
          DRIVE_FOLDER_JISSEN_2024_Q1: ${{ secrets.DRIVE_FOLDER_JISSEN_2024_Q1 }}
          DRIVE_OUTPUT_JISSEN_2024_Q1: ${{ secrets.DRIVE_OUTPUT_JISSEN_2024_Q1 }}
          DRIVE_FOLDER_JISSEN_2024_Q2: ${{ secrets.DRIVE_FOLDER_JISSEN_2024_Q2 }}
          DRIVE_OUTPUT_JISSEN_2024_Q2: ${{ secrets.DRIVE_OUTPUT_JISSEN_2024_Q2 }}
          DRIVE_FOLDER_JISSEN_2024_Q3: ${{ secrets.DRIVE_FOLDER_JISSEN_2024_Q3 }}
          DRIVE_OUTPUT_JISSEN_2024_Q3: ${{ secrets.DRIVE_OUTPUT_JISSEN_2024_Q3 }}
          DRIVE_FOLDER_JISSEN_2024_Q4: ${{ secrets.DRIVE_FOLDER_JISSEN_2024_Q4 }}
          DRIVE_OUTPUT_JISSEN_2024_Q4: ${{ secrets.DRIVE_OUTPUT_JISSEN_2024_Q4 }}
          # フォルダ自動検出モード用（target_folder 指定時に使う）
          # ROOT 配下のサブフォルダ名で動的に解決される。1 つ作るだけで何セミナーでも対応。
          DRIVE_INPUT_ROOT: ${{ secrets.DRIVE_INPUT_ROOT }}
          DRIVE_OUTPUT_ROOT: ${{ secrets.DRIVE_OUTPUT_ROOT }}
          # 全プロファイル / 自動検出モード共通
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          # OAuthユーザートークン（Drive/Gmail共通）。
          # GOOGLE_OAUTH_TOKEN_JSON が未設定なら旧 GMAIL_TOKEN_JSON にフォールバック。
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          # Gmail 下書き生成のオン/オフ（既定 OFF）。ON にしたい実行のみ
          # workflow_dispatch の create_gmail_drafts を true にする。
          ENABLE_GMAIL_DRAFTS: ${{ inputs.create_gmail_drafts }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: logs/
          retention-days: 30
