name: Generate Jissen Comments

on:
  workflow_dispatch:
    inputs:
      batch_mode:
        description: 'Use Batch API (50% off)'
        type: boolean
        default: true
      test_count:
        description: 'Test mode: process only N items (0 = all)'
        type: number
        default: 0

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6時間

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run comment generation
        run: |
          if [ "${{ inputs.batch_mode }}" = "true" ]; then
            python -m src.batch_main \
              --test-count ${{ inputs.test_count }}
          else
            python -m src.main \
              --test-count ${{ inputs.test_count }}
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: logs/
          retention-days: 30
