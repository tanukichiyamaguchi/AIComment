name: Generate Jissen Comments

on:
  workflow_dispatch:
    inputs:
      batch_mode:
        description: 'Use Batch API (50% off)'
        type: boolean
        default: true
      test_count:
        description: 'Test mode: process only N items (0 = all)'
        type: number
        default: 0

permissions:
  contents: read
  id-token: write  # Workload Identity 連携に必要

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6時間

    steps:
      - uses: actions/checkout@v4

      # Google Cloud 認証（Workload Identity 連携）
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run comment generation
        run: |
          if [ "${{ inputs.batch_mode }}" = "true" ]; then
            python -m src.batch_main \
              --test-count ${{ inputs.test_count }}
          else
            python -m src.main \
              --test-count ${{ inputs.test_count }}
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.DRIVE_OUTPUT_FOLDER_ID }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          # OAuthユーザートークン（Drive/Gmail共通）。
          # GOOGLE_OAUTH_TOKEN_JSON が未設定なら旧 GMAIL_TOKEN_JSON にフォールバック。
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: logs/
          retention-days: 30
